<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>LOGIN</h1>
        <img src="Asset/logo.jpeg" alt="Logo" class="logo">

        <form action="#">
            <label for="username">Nama Pengguna: </label>
            <input type="text" 
                   id="username" 
                   name="username" 
                   placeholder="Masukkan Username" 
                   required>

            <label for="password">Kata Sandi: </label>
            <input type="password" 
                   id="password" 
                   name="password" 
                   placeholder="Masukkan Kata Sandi" 
                   required>

            <!-- Mengubah tipe button dan menambahkan memicu fungsi JavaScript -->
            <button type="button" onclick="cekLogin()">Login</button>
        </form>

        <p><a href="#">Lupa kata sandi anda?</a></p>
        <p><a href="register.html">Daftar Sekarang</a></p>
    </div>

    <!-- Menghubungkan file JavaScript di akhir body -->
    <script src="script.js"></script>
</body>
</html>
